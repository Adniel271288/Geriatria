name: Publicar en GitHub Pages

# Publica la web (index.html) automáticamente.
# Para activarlo: en GitHub → Settings → Pages → Source = "GitHub Actions".
# Luego cada cambio en la rama principal actualiza la web. También puedes
# lanzarlo a mano desde la pestaña "Actions" (Run workflow).

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Evita despliegues simultáneos
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Subir la web (raíz del repo)
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
