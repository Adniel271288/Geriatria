name: Publicar en GitHub Pages

# OPCIONAL. La forma más sencilla de publicar NO necesita este workflow:
#   GitHub → Settings → Pages → Source = "Deploy from a branch"
#   → Branch: main · carpeta: / (root) → Save.
#
# Este workflow es la alternativa "GitHub Actions". Para usarlo:
#   GitHub → Settings → Pages → Source = "GitHub Actions".
# Luego lánzalo a mano desde la pestaña "Actions" → "Run workflow".

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir la web (raíz del repo)
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
